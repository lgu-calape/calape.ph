<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Welcome to the Municipality of Calape 🤗">
	<link rel="icon" href="./assets/calape.svg">
  <title>Municipality of Calape</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Georgia', serif;
      color: white;
    }

    .hero {
      position: relative;
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/6/60/Calape_Municipal_Hall_Aerial_View.jpg');
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      text-align: center;
    }

    .nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .nav img {
      height: 140px;
      margin-bottom: 10px;
    }

    .nav-links {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
			font-family: arial;
			background: #00000087;
			padding: 4px 16px;
			border-radius: 6px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 24px;
      letter-spacing: 1px;
			text-transform: uppercase;
    }

		.nav-links a:hover {
			color: #999;
		}

    .headline {
      max-width: 800px;
      margin: auto;
      padding-top: 100px;
      line-height: 1.4;
    }

		.headline h1 {
			font-size: 38px;
			background: #00000078;
			border-radius: 8px;
			padding: 4px 16px;
			font-family: arial;
		}

    .button {
      margin: 40px auto;
      background-color: #0a5fbeb3;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 16px;
      letter-spacing: 2px;
      cursor: pointer;
			font-weight: bold;
			text-transform: uppercase;
			border-radius: 4px;
    }

    /* Responsive Styles */
    @media (max-width: 768px) {
      .headline {
        padding-top: 60px;
        font-size: 28px;
        padding: 0 20px;
      }

      .nav-links {
        gap: 20px;
      }

      .button {
        width: 80%;
        padding: 12px 0;
        font-size: 14px;
      }

		}

		@media (max-width: 600px) {
			.headline h1 {
				font-size: 24px;
			}
			.nav-links a {
				font-size:18px;
			}
    }
  </style>
</head>
<body>

<div class="hero">
  <div class="nav">
    <img src="https://calape.ph/assets/seal.svg" alt="Logo">
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Media</a>
      <a href="#">Legislation</a>
    </div>
  </div>

  <div class="headline">
    <h1>Municipality of Calape</h1>
  </div>

  <button class="button">CONTACT US</button>
</div>
</body>
</html>
