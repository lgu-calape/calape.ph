<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Official seal / logo gallery.">
  <title>Logo Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .logo-item {
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .logo-item img {
      max-width: 100%;
      height: auto;
      border-radius: 5px;
    }
    .logo-name {
      margin-top: 10px;
      font-size: 16px;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Logo Gallery</h1>
  <div class="gallery">
    <div class="logo-item">
      <img src="assets/calape.png" alt="Calape Seal">
      <div class="logo-name">Calape Seal</div>
    </div>
    <div class="logo-item">
      <img src="assets/cces.png" alt="Calape Central Elementary School">
      <div class="logo-name">Calape Central Elementary School</div>
    </div>
    <div class="logo-item">
      <img src="assets/cnhs.png" alt="Calape National High School">
      <div class="logo-name">Calape National High School</div>
    </div>
    <div class="logo-item">
      <img src="assets/martnsf.png" alt="Calape National High School">
      <div class="logo-name">Mayor Anunciacion R. Tuazon National School of Fisheries</div>
    </div>
  </div>
</body>
</html>
